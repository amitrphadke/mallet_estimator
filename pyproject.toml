[project]
name = "mallet_estimator"
authors = [{ name = "Mallet Crafts", email = "amitrameshphadke@gmail.com" }]
description = "SKU execution estimator (material + labor + machinery + rent + design) for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
erpnext = ">=14.0.0,<17.0.0"
