name: Deploy to Frappe Cloud (staging)

# Push to main -> build the new bench AND update the staging site (the dashboard
# "Update Now" path), scoped to mallet_estimator only. The job is green ONLY when
# the running bench actually carries the new commit.
#
# Why deploy_and_update (not deploy): press.api.bench.deploy only BUILDS an image
# ("Update Available"); it does NOT move the site onto it. deploy_and_update builds
# AND migrates the sites — exactly what clicking "Update Now" does.
#
# Flow:
#   1. deploy_information -> our app's pending release + hash + the bench's sites
#      (retried, to absorb the push->FC webhook ingestion lag).
#   2. deploy_and_update {name, apps:[{app,source,release,hash}], sites:[...]}.
#   3. Poll until build=Success AND nothing in progress AND our app no longer has
#      an update available (the bench now runs the new commit).
#
# ONE-TIME SETUP (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secrets: FRAPPE_CLOUD_API_KEY, FRAPPE_CLOUD_API_SECRET  (FC account -> API Access)
#   Variables (optional): FC_HOST (default cloud.frappe.io), FC_BENCH (default bench-44687)

on:
  push:
    branches: [main]
    # Only deploy when RUNTIME code changes. Commits that only touch CI, tests,
    # cypress, or docs must never trigger a Frappe Cloud deploy (that churn jammed
    # the FC deploy queue). A commit that also touches app code still deploys.
    paths-ignore:
      - '.github/**'
      - 'cypress/**'
      - 'cypress.config.js'
      - 'mallet_estimator/tests/**'
      - '**/test_*.py'
      - '**.md'
  workflow_dispatch:   # manual "deploy now" button
    inputs:
      force:
        description: "Force re-issue the site update to the current release (use when a bench swap stalled and FC reports no update available)."
        type: boolean
        default: false

# One deploy at a time; a newer push cancels the older run so they don't pile up.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Frappe Cloud and wait for the build
        env:
          FC_HOST: ${{ vars.FC_HOST != '' && vars.FC_HOST || 'cloud.frappe.io' }}
          FC_BENCH: ${{ vars.FC_BENCH != '' && vars.FC_BENCH || 'bench-44687' }}
          FORCE: ${{ github.event.inputs.force }}
          FC_KEY: ${{ secrets.FRAPPE_CLOUD_API_KEY }}
          FC_SECRET: ${{ secrets.FRAPPE_CLOUD_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FC_KEY:-}" ] || [ -z "${FC_SECRET:-}" ]; then
            echo "::error::Missing FRAPPE_CLOUD_API_KEY / FRAPPE_CLOUD_API_SECRET repo secrets."
            exit 1
          fi
          AUTH="Authorization: token ${FC_KEY}:${FC_SECRET}"
          BENCH_BASE="https://${FC_HOST}/api/method/press.api.bench"
          CLIENT_BASE="https://${FC_HOST}/api/method/press.api.client"

          call() { # $1 = full method url, $2 = json body  ->  sets CODE, BODY
            local resp
            resp=$(curl -sSL -w $'\n%{http_code}' -X POST "$1" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$2") || true
            CODE=$(printf '%s' "$resp" | tail -n1)
            BODY=$(printf '%s' "$resp" | sed '$d')
          }
          info() { call "${BENCH_BASE}.deploy_information" "$(jq -nc --arg n "$FC_BENCH" '{name:$n}')"; }
          # True only when the last response body is well-formed JSON. Frappe Cloud
          # occasionally returns an HTML 5xx/proxy page; parsing that with jq under
          # `set -e` previously crashed the whole job (jq: parse error, exit 5).
          is_json() { printf '%s' "${1:-}" | jq empty >/dev/null 2>&1; }
          # 2xx AND a JSON body — safe to jq-parse.
          info_ok() { [ "${CODE:0:1}" = "2" ] && is_json "$BODY"; }

          # Only deploy THIS app — never drag ERPNext/CRM/etc. into a dev deploy.
          APP="mallet_estimator"

          # --- 1. find our app's pending update (retry for webhook ingestion) ----
          APPS="[]"
          for attempt in 1 2 3 4 5 6 7 8; do
            info
            if [ "${CODE:0:1}" != "2" ]; then
              echo "$BODY"
              echo "::error::deploy_information failed (HTTP ${CODE:-none}). Check FC_BENCH / API key team."
              exit 1
            fi
            # Build {app, source, release, hash} — hash of next_release (needed by
            # deploy_and_update / validate_app_hashes), matched from the releases list.
            APPS=$(printf '%s' "$BODY" | jq -c --arg app "$APP" '
              [ .message.apps[]?
                | select(.app == $app) | select(.update_available == true)
                | . as $a
                | { app: $a.app, source: $a.source, release: $a.next_release,
                    hash: ( ($a.releases // [])
                            | ( (map(select(.name == $a.next_release)) | .[0].hash)
                                // (last | .hash) // "" ) ) } ]')
            [ "$APPS" != "[]" ] && break
            echo "No update for ${APP} visible yet (attempt $attempt) — Frappe Cloud may not have ingested the push. Waiting 20s ..."
            sleep 20
          done
          # Force mode: the release is already BUILT (update_available=false) but a
          # previous site migration stalled, so the site never moved onto the new
          # bench. Re-issue deploy_and_update against the app's current/latest
          # release to kick the stuck site update.
          if { [ "$APPS" = "[]" ] || [ -z "$APPS" ]; } && [ "$FORCE" = "true" ]; then
            echo "force: re-issuing the site update to the app's current release (stalled bench swap)."
            APPS=$(printf '%s' "$BODY" | jq -c --arg app "$APP" '
              [ .message.apps[]? | select(.app == $app) | . as $a
                | ( ($a.releases // []) | last ) as $rel
                | { app: $a.app, source: $a.source,
                    release: ( $a.next_release // ($rel.name // "") ),
                    hash:    ( $rel.hash // "" ) } ]')
            echo "force APPS: $APPS"
          fi

          echo "App to update: $APPS"
          if [ "$APPS" = "[]" ] || [ -z "$APPS" ]; then
            echo "Nothing to update — Frappe Cloud already has this commit for ${APP}."
            exit 0
          fi
          if printf '%s' "$APPS" | jq -e '.[0].hash == "" or .[0].hash == null' >/dev/null; then
            echo "::error::Could not resolve the release hash for ${APP}. deploy_information.apps[].releases had no matching hash."
            printf '%s' "$BODY" | jq '.message.apps[] | select(.app=="'"$APP"'") | {next_release, releases: (.releases|map({name,hash}))}'
            exit 1
          fi

          # The hash we are deploying — success requires the SITE to actually run it.
          HASH=$(printf '%s' "$APPS" | jq -r '.[0].hash')
          echo "Deploying ${APP} @ ${HASH:0:12}"

          # Sites on this bench to migrate onto the new build (mirrors the dashboard).
          SITES=$(printf '%s' "$BODY" | jq -c '[ .message.sites[]? | {name, server, bench, skip_failing_patches: false, skip_backups: false} ]')
          echo "Sites to update: $SITES"

          # Don't stack a new build on top of one already running for this bench —
          # rapid successive pushes jammed the FC deploy queue. Wait (bounded) for
          # any in-progress deploy to settle first, then proceed regardless.
          for w in $(seq 1 30); do
            info
            info_ok || { echo "settle-check: transient response, retrying"; sleep 20; continue; }
            if [ "$(printf '%s' "$BODY" | jq -r '.message.deploy_in_progress // false')" != "true" ]; then
              break
            fi
            echo "A deploy is already in progress for ${FC_BENCH} — waiting for it to settle ($((w*20))s) ..."
            sleep 20
          done

          # --- 2. deploy AND update the sites (the dashboard "Update Now" path) --
          echo "Building the new bench and updating the site(s) ..."
          call "${BENCH_BASE}.deploy_and_update" \
            "$(jq -nc --arg n "$FC_BENCH" --argjson a "$APPS" --argjson s "$SITES" \
               '{name:$n, apps:$a, sites:$s, run_will_fail_check:false, trigger_patch_deploy:false}')"
          echo "HTTP $CODE"; echo "$BODY"
          if [ "${CODE:0:1}" != "2" ]; then
            echo "::error::deploy_and_update did NOT succeed (HTTP ${CODE:-none}). Response above."
            exit 1
          fi
          BUILD=$(printf '%s' "$BODY" | jq -r '.message // empty')
          APP_NAMES=$(printf '%s' "$APPS" | jq -c '[.[].app]')
          echo "Update triggered (${BUILD:-<unknown>}). Waiting for ${APP} to go LIVE on the bench ..."

          # --- 3. wait until the build AND the bench/site update finish ---------
          # A green build is only phase 1 (the Docker image). Frappe Cloud then
          # creates the new bench and migrates the sites (phase 2). We are done
          # only when: build = Success, nothing is in progress, and none of the
          # apps we deployed still report an update available (i.e. the running
          # bench actually carries the new commit).
          BUILT=0
          STABLE=0
          for i in $(seq 1 165); do
            sleep 20
            info
            # A transient non-JSON / non-2xx poll must never crash the job — just
            # skip this tick and try again on the next one.
            if ! info_ok; then
              echo "[$((i*20))s] transient poll response (HTTP ${CODE:-none}, non-JSON) — retrying"
              continue
            fi
            STATUS=$(printf '%s' "$BODY" | jq -r '.message.last_deploy.status // "unknown"')
            DNAME=$(printf '%s'  "$BODY" | jq -r '.message.last_deploy.name // ""')
            DIP=$(printf '%s'    "$BODY" | jq -r '.message.deploy_in_progress // false')
            BCU=$(printf '%s'    "$BODY" | jq -r '.message.bench_creation_underway // false')
            PIPE=$(printf '%s'   "$BODY" | jq -r '.message.has_running_release_pipeline // false')
            PENDING=$(printf '%s' "$BODY" | jq -r --argjson names "$APP_NAMES" \
              '[.message.apps[]? | select(.update_available==true) | select(.app as $a | $names | index($a))] | length')

            if [ "$STATUS" = "Failure" ]; then
              echo "::error::Frappe Cloud build FAILED (build ${DNAME})."
              echo "--- failing build steps ---"
              call "${CLIENT_BASE}.get" "$(jq -nc --arg d 'Deploy Candidate Build' --arg n "$DNAME" '{doctype:$d, name:$n}')"
              printf '%s' "$BODY" | jq -r '.message.build_steps[]? | select(.status=="Failure") | "STEP: \(.stage_slug // .stage) / \(.step_slug // .step)\n\(.output // .command_output // "")"' 2>/dev/null | tail -80 || true
              printf '%s' "$BODY" | jq -r '.message.build_output // empty' 2>/dev/null | tail -40 || true
              exit 1
            fi

            [ "$STATUS" = "Success" ] && BUILT=1

            # The hash the SITE currently runs for OUR app. After a SUCCESSFUL site
            # migrate this equals the hash we deployed; a FAILED migrate leaves the
            # site on the old bench, so it never matches. (update_available flips to
            # false once the image is BUILT — regardless of whether the site migrated
            # — which is exactly how a broken migrate false-greened for hours.)
            CURHASH=$(printf '%s' "$BODY" | jq -r --arg app "$APP" \
              '.message.apps[]? | select(.app==$app) | (.current_hash // .hash // "")')
            CURHASH=${CURHASH:0:12}
            echo "[$((i*20))s] build=${STATUS} deploy_in_progress=${DIP} bench_creating=${BCU} pending=${PENDING} running=${CURHASH:-?} deployed=${HASH:0:12}"

            # Done only when: build Success, nothing in progress, no pending update,
            # the bench finished creating, AND the site runs the hash we deployed —
            # held for two consecutive checks. If FC doesn't expose a running hash
            # (CURHASH empty) we don't block on it, but bench_creation_underway must
            # still have cleared, which is what a stuck/failed migrate never does.
            HASH_OK=0
            { [ -z "$CURHASH" ] || [ "$CURHASH" = "${HASH:0:12}" ]; } && HASH_OK=1
            if [ "$BUILT" = "1" ] && [ "$DIP" != "true" ] && [ "$PENDING" = "0" ] \
               && [ "$BCU" != "true" ] && [ "$HASH_OK" = "1" ]; then
              STABLE=$((STABLE + 1))
              if [ "$STABLE" -ge 2 ]; then
                echo "✅ LIVE on Frappe Cloud — build ${DNAME}; site runs ${CURHASH:-$HASH} (build + migrate succeeded)."
                exit 0
              fi
            else
              STABLE=0
            fi
          done
          echo "::error::Deploy NOT confirmed live after 55 min (build=${STATUS}, pending=${PENDING}, bench_creating=${BCU}, site runs ${CURHASH:-?} vs deployed ${HASH:0:12}). The build likely succeeded but the SITE MIGRATION did not complete — a failed migrate leaves the site on the old bench. Check the Frappe Cloud dashboard job (site → Deploys/Insights) for the migrate traceback."
          exit 1
